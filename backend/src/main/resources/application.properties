spring.application.name=inventory

# --- MySQL (localhost) ---
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Gyan@0112
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update': Hibernate creates/updates tables from your @Entity classes automatically.
# Great for learning; in real projects you'd switch to 'validate' and use
# a migration tool (Flyway/Liquibase) instead of letting Hibernate own the schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Swagger UI will be at http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
